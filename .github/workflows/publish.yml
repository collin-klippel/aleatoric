name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0) — must match packages/aleatoric/package.json"
        required: true
        type: string

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 10.9.2 (match packageManager / engines)
        run: npm install -g npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./packages/aleatoric/package.json').version")
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "Error: input version '${{ inputs.version }}' does not match packages/aleatoric/package.json version '$PKG_VERSION'"
            exit 1
          fi

      - name: Verify (lint, knip, typecheck, tests, build)
        run: npm run verify

      - name: Publish aleatoric to npm
        run: npm publish --workspace packages/aleatoric
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
