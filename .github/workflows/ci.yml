name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Use npm 10.9.2 (match packageManager / engines)
        run: npm install -g npm@10.9.2

      - name: Restore build cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/dist
          key: ${{ runner.os }}-node-22-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Knip (unused exports & deps)
        run: npm run knip

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build unified docs site
        run: npm run docs:build

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            packages/*/dist
          key: ${{ runner.os }}-node-22-${{ hashFiles('**/package-lock.json') }}

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Use npm 10.9.2 (match packageManager / engines)
        run: npm install -g npm@10.9.2

      - name: Restore build cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/dist
          key: ${{ runner.os }}-node-22-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-

      - name: Install dependencies
        run: npm ci

      - name: Build docs site for GitHub Pages
        run: npm run docs:build
        env:
          GITHUB_PAGES: true

      - name: Build playground
        run: npm run playground:build

      - name: Copy playground to docs dist
        run: cp -r packages/playground/dist packages/docs/dist/playground

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/docs/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
